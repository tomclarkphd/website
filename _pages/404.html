<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.tomclarkphd.com/">
  <script>
    (function () {
      var path = window.location.pathname;
      // Old Squarespace-style file links: /s/SomePaper.pdf -> /files/SomePaper.pdf
      var m = path.match(/^\/s\/([^\/]+)$/);
      if (m) {
        window.location.replace("/files/" + m[1]);
      } else {
        // Everything else goes to the home page
        window.location.replace("/");
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/">
  </noscript>
</head>
<body>
  <p>Sorry &mdash; that page has moved. Taking you to the <a href="https://www.tomclarkphd.com/">home page</a>&hellip;</p>
</body>
</html>
